name: Daily data refresh

on:
  schedule:
    - cron: "30 0 * * *"      # 07:30 every morning, Vietnam time
  workflow_dispatch:          # adds a "Run workflow" button for manual refreshes

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 refresh.py
      - name: Commit fresh data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: daily data refresh"
          git push
