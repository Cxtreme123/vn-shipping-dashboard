name: Daily data refresh
on:
  schedule:
    - cron: "17 */2 * * *"    # every 2h — plan + AIS snapshot refresh
  workflow_dispatch:          # "Run workflow" button for manual refreshes
permissions:
  contents: write
concurrency:
  group: data-refresh           # never let two runs overlap…
  cancel-in-progress: false     # …a running refresh always finishes; the next one waits
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild dashboard data (live AIS snapshots, plans, VPA, customs, news)
        run: python3 refresh.py
      - name: Commit fresh data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "__pycache__/" > .gitignore
          git rm -r --cached --quiet __pycache__ 2>/dev/null || true
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: data refresh"
          # survive a race with another run: rebase onto whatever landed
          # meanwhile and retry a few times before giving up
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 15
          done
          exit 1
